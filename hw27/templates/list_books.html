<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
</head>
<body>
    <h1>Список книг</h1>
    <a href="{{ url_for('add_book') }}">Додати книгу</a>
    <br><br>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Назва</th>
                <th>Автор</th>
                <th>Рік</th>
                <th>Жанр</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.year }}</td>
                <td>{{ book.genre or '' }}</td>
                <td>
                    <a href="{{ url_for('edit_book', book_id=book.id) }}">Редагувати</a>
                    <form action="{{ url_for('delete_book', book_id=book.id) }}" method="post" style="display:inline;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit">Видалити</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
